name: Deploy public website
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: public-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for published website
        id: site
        run: |
          if test -f site/index.html; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Waiting for the source workflow to publish the compiled website."
          fi
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.site.outputs.ready == 'true'
        with:
          path: site/
      - uses: actions/deploy-pages@v4
        if: steps.site.outputs.ready == 'true'
        id: deployment
